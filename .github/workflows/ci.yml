name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1
      - name: Run tests
        # No API key is set in CI on purpose: the tests use fake LLM
        # providers, and the app must work without a key.
        run: pytest -q
