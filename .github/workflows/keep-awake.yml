name: Keep app awake

# Streamlit Community Cloud puts an app to sleep after about 12 hours with
# no visitors. Visiting every 6 hours keeps it up for recruiters.
# Note: GitHub pauses scheduled workflows after 60 days with no commits to
# the repo. It emails you first; click "Enable workflow" to resume.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Open the app and wake it if needed
        run: python scripts/keep_awake.py
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep_awake_failure.png
          if-no-files-found: ignore
